<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papparoca — Registo de Jejum & Refeições</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --accent-blue: #3b82f6;
      --danger: #ef4444;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      text-align: center;
      padding: 8px 0;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 2px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .svg-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    
    /* SECÇÃO JEJUM */
    .fasting-container {
      display: flex;
      gap: 18px;
      align-items: center;
    }
    .vertical-bar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .vertical-bar-track {
      width: 18px;
      height: 160px;
      background: #1f2937;
      border-radius: 9px;
      position: relative;
      overflow: hidden;
      border: 1px solid #374151;
    }
    .vertical-bar-fill {
      width: 100%;
      background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
      position: absolute;
      bottom: 0;
      left: 0;
      border-radius: 8px;
      transition: height 0.5s ease;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .vertical-bar-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .fasting-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .timer-display {
      font-size: 2.1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      letter-spacing: -0.03em;
    }
    .fasting-stats {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
    }
    .stat-val {
      color: var(--text);
      font-weight: 500;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    button {
      flex: 1;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: #064e3b;
    }
    .btn-primary:hover { background: #059669; color: #fff; }
    .btn-danger {
      background: #271216;
      border: 1px solid #7f1d1d;
      color: #f87171;
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    /* SECÇÃO HIDRATAÇÃO (LOGO APÓS O JEJUM) */
    .hydration-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hydration-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .hydration-total {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-blue);
    }
    .hydration-target {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .progress-track {
      height: 8px;
      background: #1f2937;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-blue);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .hydration-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr) auto;
      gap: 8px;
    }
    .btn-water {
      background: #172554;
      border: 1px solid #1e3a8a;
      color: #93c5fd;
      padding: 8px 6px;
      font-size: 0.78rem;
      border-radius: 8px;
    }
    .btn-water:hover { background: #1d4ed8; color: #fff; }
    .btn-reset {
      background: #1f2937;
      color: var(--text-muted);
      border: 1px solid #374151;
      padding: 8px 10px;
      border-radius: 8px;
    }

    /* SECÇÃO REFEIÇÕES */
    .meal-input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      background: #1f2937;
      border: 1px solid #374151;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
    }
    .btn-secondary {
      background: #374151;
      color: var(--text);
    }
    .btn-secondary:hover { background: #4b5563; }
    .meal-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }
    .meal-item {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #1a2234;
      border: 1px solid #283548;
      padding: 8px 12px;
      border-radius: 10px;
    }
    .meal-thumb {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      background: #111827;
      border: 1px solid #374151;
    }
    .meal-details {
      flex: 1;
    }
    .meal-name {
      font-size: 0.88rem;
      font-weight: 600;
    }
    .meal-time {
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .meal-del {
      background: none;
      border: none;
      color: #6b7280;
      padding: 4px;
      cursor: pointer;
    }
    .meal-del:hover { color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Papparoca</h1>
      <p>Registo de Jejum & Diário Metabólico</p>
    </header>

    <!-- SECÇÃO 1: JEJUM COM BARRA VERTICAL 24H -->
    <div class="card">
      <div class="card-title">
        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Registo de Jejum
      </div>
      <div class="fasting-container">
        <div class="vertical-bar-container">
          <div class="vertical-bar-track">
            <div class="vertical-bar-fill" id="barFill" style="height: 0%;"></div>
          </div>
          <div class="vertical-bar-label">24h</div>
        </div>
        <div class="fasting-info">
          <div class="timer-display" id="timer">00:00:00</div>
          <div class="fasting-stats">
            <div class="stat-row">
              <span>Início:</span>
              <span class="stat-val" id="startTimeLabel">—</span>
            </div>
            <div class="stat-row">
              <span>Autofagia (~16h):</span>
              <span class="stat-val" id="autophagyStatus">Inativo</span>
            </div>
          </div>
          <div class="btn-group">
            <button class="btn-primary" id="startBtn" onclick="startFast()">
              <svg class="svg-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Iniciar
            </button>
            <button class="btn-danger" id="stopBtn" onclick="stopFast()" style="display:none;">
              <svg class="svg-icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg>
              Terminar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- SECÇÃO 2: GESTOR DE HIDRATAÇÃO (IMEDIATAMENTE A SEGUIR AO JEJUM) -->
    <div class="card">
      <div class="card-title">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        Hidratação Diária
      </div>
      <div class="hydration-container">
        <div class="hydration-header">
          <div class="hydration-total"><span id="waterTotal">0</span> <span style="font-size:0.85rem; font-weight:normal; color:var(--text-muted);">ml</span></div>
          <div class="hydration-target">Meta: 2500 ml</div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="waterProgress" style="width: 0%;"></div>
        </div>
        <div class="hydration-actions">
          <button class="btn-water" onclick="addWater(200)">+200 ml</button>
          <button class="btn-water" onclick="addWater(300)">+300 ml</button>
          <button class="btn-water" onclick="addWater(500)">+500 ml</button>
          <button class="btn-reset" onclick="resetWater()" title="Repor contador">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- SECÇÃO 3: REFEIÇÕES -->
    <div class="card">
      <div class="card-title">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
        Registo de Refeições
      </div>
      <div class="meal-input-group">
        <input type="text" id="mealDesc" placeholder="Descrição do prato (ex: Ovos, salada...)">
        <input type="file" id="mealPhoto" accept="image/*" capture="environment">
        <button class="btn-secondary" onclick="addMeal()">
          <svg class="svg-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Registar Prato
        </button>
      </div>
      <div class="meal-list" id="mealList"></div>
    </div>
  </div>

  <script>
    // --- ESTADO & PERSISTÊNCIA ---
    let fastStartTime = localStorage.getItem('fastStartTime') ? parseInt(localStorage.getItem('fastStartTime')) : null;
    let waterAmount = localStorage.getItem('waterAmount') ? parseInt(localStorage.getItem('waterAmount')) : 0;
    let meals = localStorage.getItem('meals') ? JSON.parse(localStorage.getItem('meals')) : [];

    function saveState() {
      if (fastStartTime) localStorage.setItem('fastStartTime', fastStartTime);
      else localStorage.removeItem('fastStartTime');
      localStorage.setItem('waterAmount', waterAmount);
      localStorage.setItem('meals', JSON.stringify(meals));
    }

    // --- JEJUM & RELÓGIO VERTICAL 24H ---
    function updateFast() {
      if (!fastStartTime) {
        document.getElementById('timer').innerText = "00:00:00";
        document.getElementById('barFill').style.height = "0%";
        document.getElementById('startTimeLabel').innerText = "—";
        document.getElementById('autophagyStatus').innerText = "Inativo";
        document.getElementById('autophagyStatus').style.color = "var(--text-muted)";
        document.getElementById('startBtn').style.display = "inline-flex";
        document.getElementById('stopBtn').style.display = "none";
        return;
      }

      document.getElementById('startBtn').style.display = "none";
      document.getElementById('stopBtn').style.display = "inline-flex";

      const now = Date.now();
      const elapsedMs = now - fastStartTime;
      const totalSec = Math.floor(elapsedMs / 1000);

      const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      document.getElementById('timer').innerText = `${h}:${m}:${s}`;

      // Data de Início
      const d = new Date(fastStartTime);
      document.getElementById('startTimeLabel').innerText = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

      // Barra vertical de 24 horas (86400 segundos)
      const pct24 = Math.min(100, (totalSec / 86400) * 100);
      document.getElementById('barFill').style.height = `${pct24}%`;

      // Alerta de Autofagia (16h = 57600 segundos)
      const statusEl = document.getElementById('autophagyStatus');
      if (totalSec >= 57600) {
        statusEl.innerText = "Ativa (Zona Otimizada)";
        statusEl.style.color = "var(--accent)";
      } else {
        const remainingH = Math.ceil((57600 - totalSec) / 3600);
        statusEl.innerText = `Em ~${remainingH}h`;
        statusEl.style.color = "var(--text-muted)";
      }
    }

    function startFast() {
      fastStartTime = Date.now();
      saveState();
      updateFast();
    }

    function stopFast() {
      if (confirm("Deseja terminar o período de jejum atual?")) {
        fastStartTime = null;
        saveState();
        updateFast();
      }
    }

    setInterval(updateFast, 1000);

    // --- HIDRATAÇÃO ---
    function renderWater() {
      document.getElementById('waterTotal').innerText = waterAmount;
      const pct = Math.min(100, (waterAmount / 2500) * 100);
      document.getElementById('waterProgress').style.width = `${pct}%`;
    }

    function addWater(ml) {
      waterAmount += ml;
      saveState();
      renderWater();
    }

    function resetWater() {
      if (confirm("Repor contador de água a zero?")) {
        waterAmount = 0;
        saveState();
        renderWater();
      }
    }

    // --- REFEIÇÕES ---
    function renderMeals() {
      const list = document.getElementById('mealList');
      list.innerHTML = "";
      meals.forEach((m, idx) => {
        const item = document.createElement('div');
        item.className = "meal-item";
        item.innerHTML = `
          ${m.photo ? `<img src="${m.photo}" class="meal-thumb">` : `<div class="meal-thumb" style="display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:0.7rem;">S/ foto</div>`}
          <div class="meal-details">
            <div class="meal-name">${m.desc}</div>
            <div class="meal-time">${m.time}</div>
          </div>
          <button class="meal-del" onclick="deleteMeal(${idx})" title="Eliminar">
            <svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        `;
        list.appendChild(item);
      });
    }

    function addMeal() {
      const descInput = document.getElementById('mealDesc');
      const fileInput = document.getElementById('mealPhoto');
      const desc = descInput.value.trim();
      if (!desc) { alert("Introduza a descrição da refeição."); return; }

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          meals.unshift({ desc: desc, photo: e.target.result, time: timeStr });
          descInput.value = "";
          fileInput.value = "";
          saveState();
          renderMeals();
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        meals.unshift({ desc: desc, photo: null, time: timeStr });
        descInput.value = "";
        saveState();
        renderMeals();
      }
    }

    function deleteMeal(idx) {
      meals.splice(idx, 1);
      saveState();
      renderMeals();
    }

    // Inicialização
    updateFast();
    renderWater();
    renderMeals();
  </script>
</body>
</html>
