<!DOCTYPE html>
<html lang="pt-PT" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f4f6fa" id="themeColorMeta" />
  <title>Papparoca — Jejum &amp; Hidratação</title>
  <style>
    :root, [data-theme="light"] {
      --bg: #f4f6fa;
      --header-bg: rgba(255, 255, 255, 0.92);
      --card: #ffffff;
      --card-2: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --desc-text: #334155;
      --tip-bg: #fffbeb;
      --accent: #d97706;
      --accent-soft: rgba(217, 119, 6, 0.12);
      --water: #0284c7;
      --water-soft: rgba(2, 132, 199, 0.10);
      --green: #059669;
      --green-soft: rgba(5, 150, 105, 0.12);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.10);
      --guide-bg: #ecfdf5;
      --guide-text: #065f46;
      --guide-source: #047857;
      --guide2-bg: #fffbeb;
      --guide2-text: #92400e;
      --guide2-source: #b45309;
      --alert-bg: linear-gradient(135deg, #e0f2fe, #f0f9ff);
      --alert-source: #0369a1;
      --recipe-text: #334155;
      --radius: 18px;
    }

    [data-theme="dark"] {
      --bg: #0f1117;
      --header-bg: rgba(15, 17, 23, 0.88);
      --card: #171a23;
      --card-2: #1f2430;
      --border: #2a3040;
      --text: #eef1f7;
      --muted: #939db5;
      --desc-text: #d6dce8;
      --tip-bg: rgba(15, 17, 23, 0.55);
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.14);
      --water: #38bdf8;
      --water-soft: rgba(56, 189, 248, 0.14);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.14);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --guide-bg: rgba(16, 185, 129, 0.09);
      --guide-text: #d1fae5;
      --guide-source: #a7f3d0;
      --guide2-bg: rgba(245, 158, 11, 0.08);
      --guide2-text: #fef3c7;
      --guide2-source: #fde68a;
      --alert-bg: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(14, 165, 233, 0.08));
      --alert-source: #bae6fd;
      --recipe-text: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
      padding-bottom: 40px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      display: grid;
      place-items: center;
      font-size: 19px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.28);
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand span {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .icon-btn {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: 0.15s ease;
    }

    .icon-btn:hover { border-color: var(--accent); }

    /* Alert Banner */
    .alert-banner {
      max-width: 1120px;
      margin: 14px auto 0;
      padding: 0 16px;
      display: none;
    }

    .alert-banner.show { display: block; animation: slideDown 0.25s ease; }

    .alert-box {
      background: var(--alert-bg);
      border: 1px solid var(--water);
      border-radius: 14px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .alert-text {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      flex: 1;
      min-width: 220px;
    }

    .alert-source {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--alert-source);
      margin-top: 3px;
      font-style: italic;
    }

    .alert-actions {
      display: flex;
      gap: 8px;
    }

    /* Main Grid */
    main {
      max-width: 1120px;
      margin: 18px auto 0;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 860px) {
      main {
        grid-template-columns: 1.08fr 0.92fr;
        align-items: start;
        gap: 20px;
      }
      .col-left, .col-right {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
    }

    @media (max-width: 859px) {
      .col-left, .col-right {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .hide-sm { display: none; }
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    .card-header {
