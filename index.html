<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1117" />
  <title>Papparoca — Jejum & Hidratação</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #171a23;
      --card-2: #1f2430;
      --border: #2a3040;
      --text: #eef1f7;
      --muted: #939db5;
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.14);
      --water: #38bdf8;
      --water-soft: rgba(56, 189, 248, 0.14);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.14);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
      padding-bottom: 40px;
      -webkit-tap-highlight-color: transparent;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(15, 17, 23, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), #ea580c);
      display: grid;
      place-items: center;
      font-size: 19px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.28);
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand span {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s ease;
    }

    .icon-btn:hover { border-color: var(--accent); }

    /* Alert Banner */
    .alert-banner {
      max-width: 1120px;
      margin: 14px auto 0;
      padding: 0 16px;
      display: none;
    }

    .alert-banner.show { display: block; animation: slideDown 0.25s ease; }

    .alert-box {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(14, 165, 233, 0.08));
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 14px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .alert-text {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      flex: 1;
      min-width: 220px;
    }

    .alert-source {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      color: #bae6fd;
      margin-top: 3px;
      font-style: italic;
    }

    .alert-actions {
      display: flex;
      gap: 8px;
    }

    /* Main Grid */
    main {
      max-width: 1120px;
      margin: 18px auto 0;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 860px) {
      main {
        grid-template-columns: 1.08fr 0.92fr;
        align-items: start;
        gap: 20px;
      }
      .col-left, .col-right {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
    }

    @media (max-width: 859px) {
      .col-left, .col-right {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .pill.fasting { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(245, 158, 11, 0.35); }
    .pill.eating { background: var(--green-soft); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.35); }
    .pill.water { background: var(--water-soft); color: var(--water); border: 1px solid rgba(56, 189, 248, 0.35); }

    /* Fasting Ring */
    .timer-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 0 12px;
    }

    .ring-container {
      position: relative;
      width: 230px;
      height: 230px;
      display: grid;
      place-items: center;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: var(--card-2);
      stroke-width: 13;
    }

    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 13;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease, stroke 0.3s ease;
    }

    .ring-center {
      position: absolute;
      text-align: center;
      padding: 0 14px;
    }

    .timer-label {
      font-size: 0.74rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .timer-digits {
      font-size: 2.15rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .timer-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Goal Chips */
    .goal-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      margin: 14px 0 16px;
    }

    .goal-chip {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .goal-chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Primary Buttons */
    .btn {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #ea580c);
      color: #111318;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.25);
    }

    .btn-photo {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #062118;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.25);
    }

    .btn-water {
      background: var(--water-soft);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--water);
      padding: 10px 8px;
      font-size: 0.8rem;
      flex-direction: column;
      gap: 2px;
    }

    .btn-water small {
      font-size: 0.68rem;
      font-weight: 500;
      opacity: 0.85;
    }

    .btn-water:hover { background: rgba(56, 189, 248, 0.22); }

    .btn-ghost {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 12px;
      font-size: 0.83rem;
    }

    .btn-ghost:hover { color: var(--text); border-color: #3f4860; }

    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 9px;
      width: 100%;
    }

    .action-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .meta-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      width: 100%;
    }

    .meta-box {
      background: var(--card-2);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .meta-box small {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .meta-box strong {
      font-size: 0.9rem;
    }

    /* Science Phase Card */
    .phase-highlight {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(234, 88, 12, 0.04));
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .phase-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .phase-name {
      font-size: 1.05rem;
      font-weight: 800;
      margin: 4px 0 6px;
    }

    .phase-desc {
      font-size: 0.86rem;
      color: #d6dce8;
      margin-bottom: 10px;
    }

    .phase-tip {
      background: rgba(15, 17, 23, 0.55);
      border-left: 3px solid var(--accent);
      padding: 9px 11px;
      border-radius: 0 8px 8px 0;
      font-size: 0.81rem;
      color: var(--text);
    }

    .source-tag {
      display: block;
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--muted);
      font-style: italic;
    }

    .phase-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .phase-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 11px;
      background: var(--card-2);
      border: 1px solid transparent;
      font-size: 0.81rem;
      opacity: 0.65;
      transition: 0.2s;
    }

    .phase-item.reached { opacity: 0.9; }
    .phase-item.current {
      opacity: 1;
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.08);
    }

    .phase-hours {
      min-width: 52px;
      font-weight: 800;
      color: var(--accent);
      font-size: 0.78rem;
      padding-top: 2px;
    }

    /* Hydration */
    .water-stats {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .water-big {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--water);
      font-variant-numeric: tabular-nums;
    }

    .water-goal {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .progress-track {
      width: 100%;
      height: 11px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284c7, var(--water));
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .water-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 13px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .water-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    @media (min-width: 480px) {
      .water-buttons { grid-template-columns: repeat(4, 1fr); }
    }

    .water-recipe {
      background: rgba(56, 189, 248, 0.07);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      border-radius: 11px;
      padding: 9px 11px;
      font-size: 0.76rem;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .water-recipe strong { color: var(--water); }

    .reminder-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--card-2);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      flex-wrap: wrap;
    }

    .reminder-bar select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 0.8rem;
    }

    /* History */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .history-empty {
      text-align: center;
      padding: 24px 12px;
      color: var(--muted);
      font-size: 0.86rem;
      background: var(--card-2);
      border-radius: 12px;
    }

    .history-item {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 10px;
    }

    .history-thumb {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      background: #10131a;
      flex-shrink: 0;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .history-no-photo {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      background: #131722;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      border: 1px dashed var(--border);
    }

    .history-info {
      flex: 1;
      min-width: 0;
    }

    .history-duration {
      font-weight: 800;
      font-size: 0.98rem;
      color: var(--accent);
    }

    .history-dates {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .history-note {
      font-size: 0.8rem;
      color: var(--text);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .del-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      font-size: 1rem;
      border-radius: 8px;
    }
    .del-btn:hover { color: var(--danger); background: var(--danger-soft); }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.8);
      backdrop-filter: blur(5px);
      display: none;
      place-items: center;
      padding: 16px;
      z-index: 60;
    }

    .modal-backdrop.open { display: grid; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      max-width: 470px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal h3 {
      font-size: 1.05rem;
      margin-bottom: 12px;
    }

    .modal label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .modal input[type="datetime-local"],
    .modal input[type="text"],
    .modal input[type="number"] {
      width: 100%;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 0.92rem;
      margin-bottom: 14px;
    }

    .modal-preview {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .break-guide {
      background: rgba(16, 185, 129, 0.09);
      border-left: 3px solid var(--green);
      padding: 9px 11px;
      border-radius: 0 8px 8px 0;
      font-size: 0.78rem;
      color: #d1fae5;
      margin-bottom: 10px;
    }

    .break-guide ul {
      margin: 5px 0 0 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-
